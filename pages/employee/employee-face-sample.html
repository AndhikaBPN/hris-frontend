<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Face Samples</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
  <link rel="stylesheet" href="../../assets/css/employee.css">
  <style>
    .fs-summary-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: #f8faf9;
      border: 1px solid #e8eeeb;
      border-radius: 10px;
      margin-bottom: 1.2rem;
    }
    .fs-summary-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fs-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #dde3ea;
      flex-shrink: 0;
    }
    .fs-dot.filled { background: #3d5c45; }
    .fs-summary-label {
      font-size: 12.5px;
      color: #4a5568;
      font-weight: 500;
    }
    .fs-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .fs-status-badge.complete   { background: #e8f5ec; color: #2e7d4f; border: 1px solid #c3e6cb; }
    .fs-status-badge.incomplete { background: #fff8e1; color: #b06000; border: 1px solid #ffe0a0; }
    .fs-pose-name {
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
    }
    .fs-pose-hint {
      font-size: 11.5px;
      color: #9aabb7;
      margin-top: 2px;
    }
    .fs-pose-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #f0f5f2;
      color: #3d5c45;
      flex-shrink: 0;
    }
    .fs-cell-pose {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fs-seq-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e8f5ec;
      color: #3d5c45;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row" style="margin-bottom:1.4rem;">
      <div>
        <h1 class="hub-title">Face Samples</h1>
        <div class="hub-sub" id="page-sub">BIOMETRIC SAMPLE MANAGEMENT</div>
      </div>
    </div>

    <div class="card" style="padding:1.4rem 1.6rem;">

      <!-- Card header -->
      <div class="emp-card-header">
        <div>
          <div style="font-size:14px;font-weight:600;color:#2c3e50;" id="card-title">Face Samples</div>
          <div class="emp-card-sub" id="card-sub">Loading...</div>
        </div>
        <button class="btn-create-team" id="btn-add" onclick="goAddSample()" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Face Sample
        </button>
      </div>

      <!-- Summary bar -->
      <div class="fs-summary-row" id="fs-summary-row" style="display:none;">
        <div class="fs-summary-dots" id="fs-summary-dots"></div>
        <span class="fs-summary-label" id="fs-summary-label">0 / 5 samples</span>
        <span class="fs-status-badge incomplete" id="fs-status-badge">Incomplete</span>
      </div>

      <!-- Table -->
      <div style="overflow-x:auto;">
        <table class="att-table emp-table" style="width:100%;">
          <thead>
            <tr>
              <th style="width:44px;text-align:center;">#</th>
              <th>Pose</th>
              <th>Captured At</th>
              <th style="width:90px;text-align:center;">Action</th>
            </tr>
          </thead>
          <tbody id="face-sample-tbody">
            <tr><td colspan="4" class="emp-empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>

    </div>

    <div style="margin-top:16px;display:flex;justify-content:flex-end;">
      <button class="back-btn" onclick="window.location.href='employee-detail.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Employee Detail
      </button>
    </div>

  </main>
</div>

<!-- TOAST -->
<div class="toast" id="app-toast">
  <svg class="toast-icon" id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span class="toast-text" id="toast-text"></span>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/face-api.js"></script>
<script>
guardRoute(['hrd_manager', 'technical_manager']);

var MAX_SAMPLES = 5;

var POSES = [
  { name: 'Front',       hint: 'Look straight at the camera',      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>' },
  { name: 'Left',        hint: 'Turn head slightly to the LEFT',    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M15 18l-6-6 6-6"/></svg>' },
  { name: 'Right',       hint: 'Turn head slightly to the RIGHT',   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M9 18l6-6-6-6"/></svg>' },
  { name: 'Up',          hint: 'Tilt chin slightly UPWARD',         icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M18 15l-6-6-6 6"/></svg>' },
  { name: 'Front (2nd)', hint: 'Look straight at the camera again', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>' }
];

var _userId  = null;
var _empName = '';
var _samples = [];

function goAddSample() {
  sessionStorage.setItem('manageFaceSampleUserId',    _userId);
  sessionStorage.setItem('manageFaceSampleMode',      'add');
  sessionStorage.setItem('manageFaceSamplePoseIndex', String(_samples.length));
  sessionStorage.setItem('manageFaceSampleEmployeeName', _empName);
  window.location.href = 'employee-face-capture.html';
}

function goEditSample(embeddingId, poseIndex) {
  sessionStorage.setItem('manageFaceSampleUserId',    _userId);
  sessionStorage.setItem('manageFaceSampleMode',      'edit');
  sessionStorage.setItem('manageFaceSampleId',        String(embeddingId));
  sessionStorage.setItem('manageFaceSamplePoseIndex', String(poseIndex));
  sessionStorage.setItem('manageFaceSampleEmployeeName', _empName);
  window.location.href = 'employee-face-capture.html';
}

function formatDateTime(str) {
  if (!str) return '—';
  var d = new Date(str.replace(' ', 'T'));
  if (isNaN(d)) return str;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function renderSummary(count) {
  var summaryRow  = document.getElementById('fs-summary-row');
  var dotsEl      = document.getElementById('fs-summary-dots');
  var labelEl     = document.getElementById('fs-summary-label');
  var badgeEl     = document.getElementById('fs-status-badge');

  summaryRow.style.display = 'flex';

  var dots = '';
  for (var i = 0; i < MAX_SAMPLES; i++) {
    dots += '<div class="fs-dot' + (i < count ? ' filled' : '') + '"></div>';
  }
  dotsEl.innerHTML = dots;
  labelEl.textContent = count + ' / ' + MAX_SAMPLES + ' samples registered';

  if (count >= MAX_SAMPLES) {
    badgeEl.className  = 'fs-status-badge complete';
    badgeEl.innerHTML  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;"><polyline points="20 6 9 17 4 12"/></svg> Complete';
  } else {
    badgeEl.className  = 'fs-status-badge incomplete';
    badgeEl.innerHTML  = (MAX_SAMPLES - count) + ' remaining';
  }
}

function renderTable(samples) {
  var tbody = document.getElementById('face-sample-tbody');
  if (!samples.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="emp-empty">No face samples registered yet.</td></tr>';
    return;
  }

  tbody.innerHTML = samples.map(function(s, i) {
    var pose = POSES[i] || { name: 'Sample ' + (i + 1), hint: '', icon: '' };
    return '<tr>' +
      '<td style="text-align:center;"><span class="fs-seq-num">' + (i + 1) + '</span></td>' +
      '<td>' +
        '<div class="fs-cell-pose">' +
          '<div class="fs-pose-icon">' + pose.icon + '</div>' +
          '<div>' +
            '<div class="fs-pose-name">' + pose.name + '</div>' +
            '<div class="fs-pose-hint">' + pose.hint + '</div>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td style="font-size:13px;color:#4a5568;">' + formatDateTime(s.created_at) + '</td>' +
      '<td style="text-align:center;">' +
        '<button class="btn-mem-edit" onclick="goEditSample(' + s.id + ',' + i + ')" title="Retake this sample">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>' +
          ' Retake' +
        '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

async function loadSamples() {
  var res = await fetchFaceEmbeddingsByUser(_userId);
  _samples = res.data || [];

  document.getElementById('card-sub').textContent = _empName ? _empName + ' · ' + _samples.length + ' / ' + MAX_SAMPLES + ' samples' : _samples.length + ' / ' + MAX_SAMPLES + ' samples';

  renderSummary(_samples.length);
  renderTable(_samples);

  document.getElementById('btn-add').style.display = _samples.length < MAX_SAMPLES ? 'inline-flex' : 'none';
}

var _toastTimer = null;
function showToast(message, type) {
  var toast  = document.getElementById('app-toast');
  var iconEl = document.getElementById('toast-icon');
  var textEl = document.getElementById('toast-text');
  if (!toast) return;
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.className = 'toast ' + (type || 'success');
  textEl.textContent = message;
  iconEl.innerHTML = type === 'error'
    ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    : '<polyline points="20 6 9 17 4 12"/>';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { toast.classList.add('show'); });
  });
  _toastTimer = setTimeout(function() { toast.classList.remove('show'); _toastTimer = null; }, 3500);
}

window.addEventListener('load', function() {
  _userId  = sessionStorage.getItem('manageFaceSampleUserId');
  _empName = sessionStorage.getItem('manageFaceSampleEmployeeName') || '';

  if (!_userId) {
    window.location.replace('employee-management.html');
    return;
  }

  if (_empName) {
    document.getElementById('card-title').textContent = _empName + ' — Face Samples';
    document.getElementById('page-sub').textContent   = 'FACE SAMPLE MANAGEMENT · ' + _empName.toUpperCase();
  }

  window.loadComponents();
  loadSamples();

  var msg  = sessionStorage.getItem('emp_toast_msg');
  var type = sessionStorage.getItem('emp_toast_type');
  if (msg) {
    sessionStorage.removeItem('emp_toast_msg');
    sessionStorage.removeItem('emp_toast_type');
    setTimeout(function() { showToast(msg, type || 'success'); }, 400);
  }
});
</script>
</body>
</html>
