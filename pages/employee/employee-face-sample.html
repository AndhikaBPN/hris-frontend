<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Face Samples</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
  <link rel="stylesheet" href="../../assets/css/employee.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row" style="margin-bottom:1.4rem;">
      <div>
        <h1 class="hub-title">Face Samples</h1>
        <div class="hub-sub" id="page-sub">BIOMETRIC SAMPLE MANAGEMENT</div>
      </div>
    </div>

    <div class="card" style="padding:1.4rem;">
      <div class="emp-card-header">
        <div>
          <div style="font-size:14px;font-weight:600;color:#2c3e50;" id="card-title">Face Samples</div>
          <div class="emp-card-sub" id="card-sub">—</div>
        </div>
        <button class="btn-primary" id="btn-add" onclick="goAddSample()" style="display:none;font-size:13px;padding:7px 14px;display:none;align-items:center;gap:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Face Sample
        </button>
      </div>

      <div style="overflow-x:auto;">
        <table class="att-table emp-table" style="width:100%;">
          <thead>
            <tr>
              <th style="width:50px;">#</th>
              <th>Pose</th>
              <th>Captured At</th>
              <th style="width:100px;">Action</th>
            </tr>
          </thead>
          <tbody id="face-sample-tbody">
            <tr><td colspan="4" class="emp-empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div style="margin-top:16px;display:flex;justify-content:flex-end;">
      <button class="back-btn" onclick="window.location.href='employee-detail.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>

  </main>
</div>

<!-- TOAST -->
<div class="toast" id="app-toast">
  <svg class="toast-icon" id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span class="toast-text" id="toast-text"></span>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/face-api.js"></script>
<script>
guardRoute(['hrd_manager', 'technical_manager']);

var POSE_LABELS = ['Front', 'Left', 'Right', 'Up', 'Front (2nd)'];
var MAX_SAMPLES = 5;

var _userId   = null;
var _empName  = '';
var _samples  = [];

function goAddSample() {
  var nextIndex = _samples.length;
  sessionStorage.setItem('manageFaceSampleUserId',   _userId);
  sessionStorage.setItem('manageFaceSampleMode',     'add');
  sessionStorage.setItem('manageFaceSamplePoseIndex', String(nextIndex));
  window.location.href = 'employee-face-capture.html';
}

function goEditSample(embeddingId, poseIndex) {
  sessionStorage.setItem('manageFaceSampleUserId',   _userId);
  sessionStorage.setItem('manageFaceSampleMode',     'edit');
  sessionStorage.setItem('manageFaceSampleId',       String(embeddingId));
  sessionStorage.setItem('manageFaceSamplePoseIndex', String(poseIndex));
  window.location.href = 'employee-face-capture.html';
}

function formatDateTime(str) {
  if (!str) return '—';
  var d = new Date(str.replace(' ', 'T'));
  if (isNaN(d)) return str;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function renderTable(samples) {
  var tbody = document.getElementById('face-sample-tbody');
  if (!samples.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="emp-empty">No face samples registered yet.</td></tr>';
    return;
  }

  tbody.innerHTML = samples.map(function(s, i) {
    var poseLabel = POSE_LABELS[i] || ('Sample ' + (i + 1));
    return '<tr>' +
      '<td style="text-align:center;color:#9aabb7;font-size:13px;">' + (i + 1) + '</td>' +
      '<td>' +
        '<span style="font-size:13px;font-weight:500;color:#2c3e50;">' + poseLabel + '</span>' +
        '<div style="font-size:11.5px;color:#9aabb7;margin-top:2px;">ID: ' + s.id + '</div>' +
      '</td>' +
      '<td style="font-size:13px;color:#4a5568;">' + formatDateTime(s.created_at) + '</td>' +
      '<td>' +
        '<div class="emp-actions">' +
          '<button class="action-btn edit" onclick="goEditSample(' + s.id + ',' + i + ')" title="Retake this sample">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>' +
          '</button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');
}

async function loadSamples() {
  var res = await fetchFaceEmbeddingsByUser(_userId);
  _samples = res.data || [];

  document.getElementById('card-sub').textContent = _samples.length + ' / ' + MAX_SAMPLES + ' samples registered';

  renderTable(_samples);

  var btnAdd = document.getElementById('btn-add');
  if (_samples.length < MAX_SAMPLES) {
    btnAdd.style.display = 'flex';
  } else {
    btnAdd.style.display = 'none';
  }
}

var _toastTimer = null;
function showToast(message, type) {
  var toast  = document.getElementById('app-toast');
  var iconEl = document.getElementById('toast-icon');
  var textEl = document.getElementById('toast-text');
  if (!toast) return;
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.className = 'toast ' + (type || 'success');
  textEl.textContent = message;
  iconEl.innerHTML = type === 'error'
    ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    : '<polyline points="20 6 9 17 4 12"/>';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { toast.classList.add('show'); });
  });
  _toastTimer = setTimeout(function() { toast.classList.remove('show'); _toastTimer = null; }, 3500);
}

window.addEventListener('load', function() {
  _userId  = sessionStorage.getItem('manageFaceSampleUserId');
  _empName = sessionStorage.getItem('manageFaceSampleEmployeeName') || '';

  if (!_userId) {
    window.location.replace('employee-management.html');
    return;
  }

  if (_empName) {
    document.getElementById('card-title').textContent = _empName + ' — Face Samples';
    document.getElementById('page-sub').textContent = 'FACE SAMPLE MANAGEMENT · ' + _empName.toUpperCase();
  }

  window.loadComponents();
  loadSamples();

  var msg  = sessionStorage.getItem('emp_toast_msg');
  var type = sessionStorage.getItem('emp_toast_type');
  if (msg) {
    sessionStorage.removeItem('emp_toast_msg');
    sessionStorage.removeItem('emp_toast_type');
    setTimeout(function() { showToast(msg, type || 'success'); }, 400);
  }
});
</script>
</body>
</html>
