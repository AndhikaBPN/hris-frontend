<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Employee Detail</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
  <link rel="stylesheet" href="../../assets/css/employee.css">
  <link rel="stylesheet" href="../../assets/css/employee-detail.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row" style="margin-bottom:1.4rem;">
      <div>
        <h1 class="hub-title">Detail Employee</h1>
        <div class="hub-sub">DETAIL EMPLOYEE INFORMATION</div>
      </div>
    </div>

    <div class="detail-layout">

      <!-- ══ LEFT: Profile Sidebar ══ -->
      <div class="profile-sidebar">
        <div class="profile-sidebar-header">
          <div class="profile-avatar-lg" id="profile-avatar">
            <span id="avatar-content">—</span>
          </div>
          <div class="profile-header-name" id="hero-name">Loading...</div>
        </div>
        <div class="profile-sidebar-body">
          <div class="profile-sidebar-badges">
            <span id="hero-role-badge"></span>
            <span id="hero-status-badge"></span>
          </div>
          <div class="profile-divider"></div>
          <div class="profile-meta-list">
            <div class="profile-meta-row" id="sidebar-email-row" style="display:none;">
              <span class="profile-meta-label">Email</span>
              <span class="profile-meta-value" id="sidebar-email" style="word-break:break-all;font-size:12px;">—</span>
            </div>
            <div class="profile-meta-row" id="sidebar-phone-row" style="display:none;">
              <span class="profile-meta-label">Phone</span>
              <span class="profile-meta-value" id="sidebar-phone" style="font-size:12px;">—</span>
            </div>
            <div class="profile-meta-row" id="sidebar-birth-row" style="display:none;">
              <span class="profile-meta-label">Birth Date</span>
              <span class="profile-meta-value" id="sidebar-birth" style="font-size:12px;">—</span>
            </div>
            <div class="profile-meta-row" id="sidebar-gender-row" style="display:none;">
              <span class="profile-meta-label">Gender</span>
              <span class="profile-meta-value" id="sidebar-gender" style="font-size:12px;">—</span>
            </div>
            <div class="profile-meta-row" id="sidebar-religion-row" style="display:none;">
              <span class="profile-meta-label">Religion</span>
              <span class="profile-meta-value" id="sidebar-religion" style="font-size:12px;">—</span>
            </div>
            <div class="profile-meta-row">
              <span class="profile-meta-label">Status</span>
              <span class="profile-meta-value" id="sidebar-status-meta">—</span>
            </div>
            <div class="profile-meta-row">
              <span class="profile-meta-label">Team</span>
              <span class="profile-meta-value" id="sidebar-team">—</span>
            </div>
            <div class="profile-meta-row">
              <span class="profile-meta-label">Manager</span>
              <span class="profile-meta-value" id="sidebar-manager">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ RIGHT: Info Card ══ -->
      <div class="detail-card">

        <!-- Section: Personal Info -->
        <div class="detail-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Personal Information
        </div>
        <div class="detail-grid">
          <div class="detail-field">
            <span class="detail-label">Full Name</span>
            <input type="text" class="detail-input" id="d-name" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Email Address</span>
            <input type="email" class="detail-input" id="d-email" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Birth Date</span>
            <input type="text" class="detail-input" id="d-birth-date" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Gender</span>
            <input type="text" class="detail-input" id="d-gender" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Phone</span>
            <input type="text" class="detail-input" id="d-phone" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Religion</span>
            <input type="text" class="detail-input" id="d-religion" disabled>
          </div>
          <div class="detail-field full-width">
            <span class="detail-label">Address</span>
            <input type="text" class="detail-input" id="d-address" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Account Status</span>
            <span id="d-status">—</span>
          </div>
        </div>

        <div class="detail-section-sep"></div>

        <!-- Section: Employment Info -->
        <div class="detail-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          Employment Details
        </div>
        <div class="detail-grid">
          <div class="detail-field">
            <span class="detail-label">Reports To (Manager)</span>
            <input type="text" class="detail-input" id="d-manager" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Team</span>
            <input type="text" class="detail-input" id="d-team" disabled>
          </div>
          <div class="detail-field">
            <span class="detail-label">Role</span>
            <span id="d-role">—</span>
          </div>
        </div>

      </div>
    </div>

    <div style="margin-top:16px;display:flex;justify-content:flex-end;">
      <button class="back-btn" onclick="window.location.href='employee-management.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>

  </main>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/render/team.js"></script>
<script src="../../assets/js/render/employee.js"></script>
<script src="../../assets/js/fetch/employee-detail.js"></script>
<script src="../../assets/js/render/employee-detail.js"></script>
<script>
guardRoute(['c_level', 'hrd_manager']);

var currentEmployeeId = null;

async function loadDetail() {
  var res = await fetchEmployeeDetail(currentEmployeeId);
  if (!res.success) {
    document.getElementById('hero-name').textContent = 'Employee not found';
    return;
  }
  renderDetail(mapEmployeeDetailData(res.data));
}

function renderDetail(d) {
  /* ── Avatar ── */
  var avatarEl = document.getElementById('profile-avatar');
  var avatarContent = document.getElementById('avatar-content');
  if (d.photoProfile) {
    avatarEl.style.background = 'transparent';
    avatarContent.innerHTML = '<img src="' + escHtml(d.photoProfile) + '" alt="' + escHtml(d.name) + '">';
  } else {
    avatarEl.style.background = d.avatarBg;
    avatarEl.style.color      = d.avatarColor;
    avatarContent.textContent = d.initials;
  }

  /* ── Sidebar identity ── */
  setText('hero-name', d.name);

  var heroRole = document.getElementById('hero-role-badge');
  if (heroRole) heroRole.innerHTML = '<span class="emp-role-badge ' + d.roleBadge.colorClass + '">' + escHtml(d.roleBadge.label) + '</span>';

  var heroStatus = document.getElementById('hero-status-badge');
  if (heroStatus) heroStatus.innerHTML = '<span class="emp-status-badge ' + d.statusBadge.colorClass + '">' + d.statusBadge.label + '</span>';

  var managerVal = d.managerName || (d.managerId ? 'ID: ' + d.managerId : '—');
  var teamVal    = d.teamName    || (d.teamId    ? 'ID: ' + d.teamId    : '—');

  setText('sidebar-team',    teamVal);
  setText('sidebar-manager', managerVal);

  /* ── Sidebar meta rows ── */
  function setSidebarRow(rowId, valId, value) {
    var row = document.getElementById(rowId);
    var el  = document.getElementById(valId);
    if (!row || !el) return;
    if (value && value !== '—') { row.style.display = ''; el.textContent = value; }
    else                        { row.style.display = 'none'; }
  }
  setSidebarRow('sidebar-email-row',    'sidebar-email',    d.email);
  setSidebarRow('sidebar-phone-row',    'sidebar-phone',    d.phone);
  setSidebarRow('sidebar-birth-row',    'sidebar-birth',    d.birthDateDisplay);
  setSidebarRow('sidebar-gender-row',   'sidebar-gender',   d.gender ? d.gender.charAt(0).toUpperCase() + d.gender.slice(1) : null);
  setSidebarRow('sidebar-religion-row', 'sidebar-religion', d.religion);

  var statusMetaEl = document.getElementById('sidebar-status-meta');
  if (statusMetaEl) statusMetaEl.innerHTML = '<span class="emp-status-badge ' + d.statusBadge.colorClass + '">' + d.statusBadge.label + '</span>';

  /* ── Form fields ── */
  setField('d-name',       d.name);
  setField('d-email',      d.email);
  setField('d-birth-date', d.birthDateDisplay);
  setField('d-gender',     d.gender ? d.gender.charAt(0).toUpperCase() + d.gender.slice(1) : null);
  setField('d-phone',      d.phone);
  setField('d-religion',   d.religion);
  setField('d-address',    d.address);
  setField('d-manager',    managerVal);
  setField('d-team',       teamVal);

  /* ── Badge fields ── */
  var roleEl = document.getElementById('d-role');
  if (roleEl) roleEl.innerHTML = '<span class="emp-role-badge ' + d.roleBadge.colorClass + '">' + escHtml(d.roleBadge.label) + '</span>';

  var statusEl = document.getElementById('d-status');
  if (statusEl) statusEl.innerHTML = '<span class="emp-status-badge ' + d.statusBadge.colorClass + '">' + d.statusBadge.label + '</span>';
}

function setField(id, value) {
  var el = document.getElementById(id);
  if (el) el.value = (value !== null && value !== undefined && value !== '') ? String(value) : '—';
}

function setText(id, value) {
  var el = document.getElementById(id);
  if (el) el.textContent = (value !== null && value !== undefined) ? String(value) : '—';
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.addEventListener('load', function() {
  currentEmployeeId = sessionStorage.getItem('selectedEmployeeId') || sessionStorage.getItem('currentEmployeeId');
  sessionStorage.removeItem('selectedEmployeeId');
  if (currentEmployeeId) sessionStorage.setItem('currentEmployeeId', currentEmployeeId);

  if (!currentEmployeeId) {
    window.location.replace('employee-management.html');
    return;
  }

  loadDetail();
  window.loadComponents();
});
</script>
</body>
</html>
