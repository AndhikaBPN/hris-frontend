<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Sanctuary – C-Level Dashboard</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="main-wrap">
  <div id="navbar-placeholder"></div>
  <main class="content">
    <div class="page-header-row">
      <div>
        <h1 class="hub-title" id="greeting-text">Good morning.</h1>
        <div class="hub-sub" id="greeting-sub"></div>
      </div>
    </div>

    <!-- STAT CARDS -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-icon green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="stat-label">TOTAL EMPLOYEES</div>
        <div class="stat-value" id="stat-karyawan">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="stat-label">TOTAL DIVISIONS</div>
        <div class="stat-value" id="stat-divisi">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
        </div>
        <div class="stat-label">TOTAL TEAMS</div>
        <div class="stat-value" id="stat-team">0</div>
      </div>
    </div>

    <!-- TABEL ABSENSI MANAGER + STAFF -->
    <div class="table-row">
      <div class="card">
        <div class="attendance-header">
          <h2 class="section-title">Manager Attendance — Today</h2>
          <a class="view-all" href="#"></a>
        </div>
        <table class="att-table">
          <thead><tr><th>NAME</th><th>CLOCK IN</th><th>CLOCK OUT</th><th>STATUS</th></tr></thead>
          <tbody id="tbody-manager"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="attendance-header">
          <h2 class="section-title">Staff Attendance — Today</h2>
          <a class="view-all" href="#"></a>
        </div>
        <table class="att-table">
          <thead><tr><th>NAME</th><th>CLOCK IN</th><th>CLOCK OUT</th><th>STATUS</th></tr></thead>
          <tbody id="tbody-staff"></tbody>
        </table>
      </div>
    </div>

    <!-- DATA CUTI + BIRTHDAY -->
    <div class="table-row">
      <div class="card">
        <div class="attendance-header">
          <h2 class="section-title">Employee Leave Data</h2>
          <a class="view-all" href="#"></a>
        </div>
        <table class="att-table">
          <thead><tr><th>EMPLOYEE</th><th>TYPE</th><th>DATE</th><th>STATUS</th></tr></thead>
          <tbody id="tbody-leave"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="attendance-header">
          <h2 class="section-title">Birthdays This Month</h2>
        </div>
        <table class="att-table">
          <thead><tr><th>EMPLOYEE</th><th>TEAM</th><th>DATE</th></tr></thead>
          <tbody id="tbody-birthday"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/dashboard.js"></script>
<script src="../../assets/js/render/dashboard.js"></script>
<script>
var ROLE_LABEL = 'C-LEVEL';
var ROLE_COLOR = '#7d5a9a';
guardRoute(['c_level']);

window.addEventListener('load', function() {
  initDateGreeting(getFirstName());
  var gs = document.getElementById('greeting-sub');
  if (gs) gs.textContent = 'COMPANY PERFORMANCE OVERVIEW';

  window.loadComponents().then(function() {
    loadManagerAttendance();
    loadStaffAttendance();
    loadStatCards();
    loadLeaveData();
    loadBirthdayData();
    updateLiveClock();
    setInterval(updateLiveClock, 1000);
    animateProgress(8);
  });
});

async function loadManagerAttendance() {
  var res = await fetchAttendanceToday('manager');
  if (res.success) {
    var rows = buildAttendanceRows(res.data, 'manager');
    renderAttendanceTable(rows, 'tbody-manager');
  }
}

async function loadStaffAttendance() {
  var res = await fetchAttendanceToday('staff');
  if (res.success) {
    var rows = buildAttendanceRows(res.data, 'staff');
    renderAttendanceTable(rows, 'tbody-staff');
  }
}

async function loadStatCards() {
  var resUsers = await fetchCount('/users/count');
  if (resUsers.success) {
    document.getElementById('stat-karyawan').textContent = resUsers.data.total || 0;
  }

  var resTeams = await fetchCount('/teams/count');
  if (resTeams.success) {
    document.getElementById('stat-divisi').textContent = resTeams.data.total || 0;
  }

  var resRoles = await fetchCount('/roles/count');
  if (resRoles.success) {
    document.getElementById('stat-team').textContent = resRoles.data.total || 0;
  }
}

async function loadLeaveData() {
  var res = await fetchLeaveRequests();
  if (res.success) {
    var rows = buildLeaveRows(res.data);
    renderLeaveTable(rows, 'tbody-leave');
  }
}

async function loadBirthdayData() {
  var res = await fetchBirthdays();
  if (res.success) {
    var rows = buildBirthdayRows(res.data);
    renderBirthdayTable(rows, 'tbody-birthday');
  }
}

function renderAttendanceTable(rows, tbodyId) {
  var tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">No attendance data</td></tr>';
    return;
  }

  rows.forEach(function(row) {
    var statusInfo = getStatusLabel(row.status);
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + row.name + '</td>' +
                   '<td>' + (row.checkInTime || row.checkIn1 || '--:--') + '</td>' +
                   '<td>' + (row.checkOutTime || row.checkIn2 || '--:--') + '</td>' +
                   '<td><span style="color:' + statusInfo.color + '">' + statusInfo.label + '</span></td>';
    tbody.appendChild(tr);
  });
}

function renderLeaveTable(rows, tbodyId) {
  var tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">No leave data</td></tr>';
    return;
  }

  rows.forEach(function(row) {
    var statusInfo = getStatusLabel(row.status);
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + row.name + '</td>' +
                   '<td>' + row.leaveType + '</td>' +
                   '<td>' + row.dateRange + '</td>' +
                   '<td><span style="color:' + statusInfo.color + '">' + statusInfo.label + '</span></td>';
    tbody.appendChild(tr);
  });
}

function renderBirthdayTable(rows, tbodyId) {
  var tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;">No birthdays this month</td></tr>';
    return;
  }

  rows.forEach(function(row) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td>' + row.name + '</td>' +
                   '<td>' + row.department + '</td>' +
                   '<td>' + row.birthDate + '</td>';
    tbody.appendChild(tr);
  });
}

function getStatusLabel(status) {
  var STATUS_MAP = {
    'valid': { label: '● Valid', color: '#2e7d4f' },
    'late': { label: '● Late', color: '#b06000' },
    'invalid': { label: '● Invalid', color: '#c0392b' },
    'leave': { label: '● Leave', color: '#2980b9' },
    'sick-leave': { label: '● Sick Leave', color: '#2980b9' },
    'permit': { label: '● Permit', color: '#2980b9' },
    'approved': { label: '● Approved', color: '#2e7d4f' },
    'pending': { label: '● Pending', color: '#f39c12' }
  };
  return STATUS_MAP[status] || { label: '● Pending', color: '#95a5a6' };
}
</script>
</body>
</html>
