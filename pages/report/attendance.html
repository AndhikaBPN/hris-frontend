<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Attendance Report</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
  <link rel="stylesheet" href="../../assets/css/employee.css">
  <link rel="stylesheet" href="../../assets/css/report.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row" style="margin-bottom:1.4rem;">
      <div>
        <h1 class="hub-title">Attendance Report</h1>
        <div class="hub-sub">MONTHLY ATTENDANCE OVERVIEW</div>
      </div>
    </div>

    <div class="card" style="padding:1.4rem 1.6rem;">

      <div class="emp-card-header">
        <div>
          <div style="font-size:14px;font-weight:600;color:#2c3e50;">Attendance Report</div>
          <div class="emp-card-sub" id="rpt-sub">Select year and month to load data</div>
        </div>
        <div class="rpt-export-row">
          <button class="btn-export" id="btn-xlsx" onclick="doExport('xlsx')" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="3" x2="8" y2="21"/><line x1="2" y1="9" x2="8" y2="9"/><path d="M12 9l8 6M20 9l-8 6"/></svg>
            Export XLSX
          </button>
          <button class="btn-export" id="btn-pdf" onclick="doExport('pdf')" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Export PDF
          </button>
        </div>
      </div>

      <div class="rpt-filters">
        <select class="rpt-filter-select" id="filter-year" onchange="loadReport()"></select>
        <select class="rpt-filter-select" id="filter-month" onchange="loadReport()">
          <option value="1">January</option><option value="2">February</option>
          <option value="3">March</option><option value="4">April</option>
          <option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option>
          <option value="9">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
        <input class="rpt-filter-input" id="filter-name" placeholder="Search by name..." oninput="renderFiltered()">
      </div>

      <div style="overflow-x:auto;">
        <table class="att-table emp-table" style="width:100%;min-width:920px;">
          <thead>
            <tr>
              <th style="width:44px;text-align:center;">#</th>
              <th>Name</th>
              <th>Role</th>
              <th style="text-align:center;">Scheduled</th>
              <th style="text-align:center;">Present</th>
              <th style="text-align:center;">Late</th>
              <th style="text-align:center;">Absent</th>
              <th style="text-align:center;">Session 1</th>
              <th style="text-align:center;">Session 2</th>
              <th style="text-align:center;">Invalid</th>
            </tr>
          </thead>
          <tbody id="rpt-tbody">
            <tr><td colspan="10" class="emp-empty">Select filters above to load data.</td></tr>
          </tbody>
          <tfoot id="rpt-tfoot"></tfoot>
        </table>
      </div>
      <div class="rpt-pagination" id="rpt-pagination"></div>

    </div>

  </main>
</div>

<div class="toast" id="app-toast">
  <svg class="toast-icon" id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span class="toast-text" id="toast-text"></span>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/report.js"></script>
<script>
guardRoute(['c_level', 'hrd_manager', 'technical_manager', 'team_leader', 'staff']);

var _role  = (JSON.parse(localStorage.getItem('hris_user') || '{}').role) || '';
var _data  = [];
var _page  = 1;
var _totalPages   = 1;
var _totalRecords = 0;
var _limit = 25;

var MONTH_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
var ROLE_LABELS = { c_level:'C-Level', hrd_manager:'HRD Manager', technical_manager:'Tech Manager', team_leader:'Team Leader', staff:'Staff' };

function buildYearOptions() {
  var now = new Date().getFullYear();
  var sel = document.getElementById('filter-year');
  for (var y = now + 1; y >= 2023; y--) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    if (y === now) opt.selected = true;
    sel.appendChild(opt);
  }
}

function buildMonthOptions() {
  var now = new Date().getMonth() + 1;
  var sel = document.getElementById('filter-month');
  for (var i = 0; i < sel.options.length; i++) {
    if (parseInt(sel.options[i].value) === now) { sel.options[i].selected = true; break; }
  }
}

function completionBadge(val) {
  var p = parseFloat(val) || 0;
  var cls = p >= 80 ? 'rpt-badge-green' : p >= 50 ? 'rpt-badge-yellow' : 'rpt-badge-red';
  return '<span class="rpt-badge ' + cls + '">' + p.toFixed(0) + '%</span>';
}

function renderFiltered() {
  var q = (document.getElementById('filter-name').value || '').toLowerCase().trim();
  var rows = q ? _data.filter(function(r) { return (r.name || '').toLowerCase().includes(q); }) : _data;
  renderTable(rows);
}

function renderTable(rows) {
  var tbody  = document.getElementById('rpt-tbody');
  var offset = (_page - 1) * _limit;
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="emp-empty">No data found for selected filters.</td></tr>';
    renderFooter([]);
    return;
  }
  tbody.innerHTML = rows.map(function(r, i) {
    return '<tr>' +
      '<td style="text-align:center;color:#9aabb7;font-size:12px;">' + (offset + i + 1) + '</td>' +
      '<td style="font-weight:500;">' + escHtml(r.name || '—') + '</td>' +
      '<td><span class="rpt-role-badge">' + escHtml(ROLE_LABELS[r.role] || r.role || '—') + '</span></td>' +
      '<td style="text-align:center;">' + (r.total_days != null ? r.total_days : '—') + '</td>' +
      '<td style="text-align:center;">' + (r.present || 0) + '</td>' +
      '<td style="text-align:center;">' + (r.late || 0) + '</td>' +
      '<td style="text-align:center;">' + (r.absent || 0) + '</td>' +
      '<td style="text-align:center;">' + completionBadge(r.session_1_completion) + '</td>' +
      '<td style="text-align:center;">' + completionBadge(r.session_2_completion) + '</td>' +
      '<td style="text-align:center;">' + (r.invalid_records || 0) + '</td>' +
    '</tr>';
  }).join('');
  renderFooter(rows);
}

function renderFooter(rows) {
  var tfoot = document.getElementById('rpt-tfoot');
  if (!rows.length) { tfoot.innerHTML = ''; return; }
  var totalPresent = rows.reduce(function(s, r) { return s + (parseFloat(r.present) || 0); }, 0);
  var totalDays    = rows.reduce(function(s, r) { return s + (parseFloat(r.total_days) || 0); }, 0);
  var totalLate    = rows.reduce(function(s, r) { return s + (parseFloat(r.late) || 0); }, 0);
  var totalInvalid = rows.reduce(function(s, r) { return s + (parseInt(r.invalid_records) || 0); }, 0);
  var avgPresent   = totalDays > 0 ? (totalPresent / totalDays * 100).toFixed(1) + '%' : '—';
  var avgLate      = totalDays > 0 ? (totalLate / totalDays * 100).toFixed(1) + '%' : '—';
  tfoot.innerHTML = '<tr class="rpt-footer-row">' +
    '<td colspan="3" style="padding-left:12px;">Page ' + _page + ' · ' + rows.length + ' of ' + _totalRecords + ' employee(s)</td>' +
    '<td style="text-align:center;">—</td>' +
    '<td style="text-align:center;" title="Avg present rate">' + avgPresent + '</td>' +
    '<td style="text-align:center;" title="Avg late rate">' + avgLate + '</td>' +
    '<td style="text-align:center;">—</td>' +
    '<td colspan="2" style="text-align:center;">—</td>' +
    '<td style="text-align:center;">' + totalInvalid + '</td>' +
  '</tr>';
}

function renderPagination() {
  var el = document.getElementById('rpt-pagination');
  if (!el) return;
  var limitOpts = [10, 25, 50, 100].map(function(v) {
    return '<option value="' + v + '"' + (v === _limit ? ' selected' : '') + '>' + v + '</option>';
  }).join('');
  var info = _totalRecords + ' record(s)' + (_totalPages > 1 ? ' · Page ' + _page + '/' + _totalPages : '');
  el.innerHTML =
    '<div class="pagination-left">' +
      '<span class="pag-label">LIMIT PER PAGE</span>' +
      '<select class="pag-select" onchange="onLimitChange(this.value)">' + limitOpts + '</select>' +
    '</div>' +
    '<div class="pagination-right">' +
      '<span class="pag-info">' + info + '</span>' +
      '<button class="pag-btn" onclick="goToPage(' + (_page - 1) + ')"' + (_page <= 1 ? ' disabled' : '') + '>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="15 18 9 12 15 6"/></svg>' +
      '</button>' +
      '<button class="pag-btn" onclick="goToPage(' + (_page + 1) + ')"' + (_page >= _totalPages ? ' disabled' : '') + '>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</button>' +
    '</div>';
}

function onLimitChange(val) {
  _limit = parseInt(val) || 25;
  loadReport();
}

function goToPage(n) {
  if (n < 1 || n > _totalPages || n === _page) return;
  _page = n;
  loadReport(false);
}

async function loadReport(resetPage) {
  if (resetPage !== false) _page = 1;
  var year  = document.getElementById('filter-year').value;
  var month = document.getElementById('filter-month').value;
  setLoading(true);
  var res = await fetchAttendanceReport(year, month, _page, _limit);
  setLoading(false);
  if (!res.success) { showError(res.error || 'Failed to load data'); return; }
  _data = res.data;
  var meta = res.meta || {};
  _totalRecords = meta.total_records || _data.length;
  _totalPages   = meta.last_page    || 1;
  _page         = meta.current_page || _page;
  document.getElementById('rpt-sub').textContent =
    _totalRecords + ' employee(s) · ' + MONTH_NAMES[parseInt(month)] + ' ' + year +
    (_totalPages > 1 ? ' · Page ' + _page + '/' + _totalPages : '');
  document.getElementById('btn-xlsx').disabled = false;
  document.getElementById('btn-pdf').disabled  = false;
  renderFiltered();
  renderPagination();
}

function setLoading(on) {
  if (on) {
    document.getElementById('rpt-tbody').innerHTML = '<tr><td colspan="10" class="emp-empty"><span class="rpt-spinner"></span>Loading...</td></tr>';
    document.getElementById('btn-xlsx').disabled = true;
    document.getElementById('btn-pdf').disabled  = true;
    var pg = document.getElementById('rpt-pagination');
    if (pg) pg.innerHTML = '';
  }
}

function showError(msg) {
  document.getElementById('rpt-tbody').innerHTML = '<tr><td colspan="10" class="emp-empty" style="color:#c0392b;">' +
    escHtml(msg) + ' <button onclick="loadReport()" style="margin-left:8px;padding:4px 10px;border:1px solid #c0392b;border-radius:6px;color:#c0392b;background:none;cursor:pointer;font-size:12px;">Retry</button></td></tr>';
}

async function doExport(format) {
  var year  = document.getElementById('filter-year').value;
  var month = document.getElementById('filter-month').value;
  var btn   = document.getElementById('btn-' + format);
  if (btn) btn.disabled = true;
  var res = await exportReportFile('attendance', { format: format, year: year, month: month });
  if (!res.success) showToast('Export failed: ' + (res.error || ''), 'error');
  if (btn) btn.disabled = false;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var _toastTimer = null;
function showToast(message, type) {
  var toast = document.getElementById('app-toast');
  var iconEl = document.getElementById('toast-icon');
  var textEl = document.getElementById('toast-text');
  if (!toast) return;
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.className = 'toast ' + (type || 'success');
  textEl.textContent = message;
  iconEl.innerHTML = type === 'error'
    ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    : '<polyline points="20 6 9 17 4 12"/>';
  requestAnimationFrame(function() { requestAnimationFrame(function() { toast.classList.add('show'); }); });
  _toastTimer = setTimeout(function() { toast.classList.remove('show'); _toastTimer = null; }, 3500);
}

window.addEventListener('load', function() {
  buildYearOptions();
  buildMonthOptions();
  if (_role === 'staff') {
    document.getElementById('filter-name').style.display = 'none';
    var exportRow = document.querySelector('.rpt-export-row');
    if (exportRow) exportRow.style.display = 'none';
  }
  checkTokenName();
  window.loadComponents();
  loadReport();
});
</script>
</body>
</html>
