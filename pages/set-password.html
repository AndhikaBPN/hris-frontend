<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password – Sanctuary</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://unpkg.com/lucide@0.462.0" integrity="sha384-8nT3SpButyvenpAdKYPJzXdSz3zidMGduMoaMvwjKnAWVv238n6P1mhveiJJQWrV" crossorigin="anonymous"></script>
</head>
<body>

<div class="page active" id="page-set-password">
  <div class="reset-overlay">
    <div class="reset-card">
      <div class="reset-header">
        <h2>Set Your Password</h2>
      </div>

      <div id="step-password" class="reset-step active">
        <p class="reset-sub">Create a secure password for your new account.</p>

        <div class="field">
          <label for="new-password">New Password</label>
          <div class="input-wrap">
            <i data-lucide="lock"></i>
            <input type="password" id="new-password" placeholder="••••••••••">
            <button type="button" class="toggle-pass" onclick="togglePass('new-password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <i data-lucide="lock"></i>
            <input type="password" id="confirm-password" placeholder="••••••••••">
            <button type="button" class="toggle-pass" onclick="togglePass('confirm-password', this)">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div id="password-msg" class="msg"></div>

        <button class="btn btn--reset" id="submit-btn" onclick="handleSetPassword()">
          Set Password
          <i data-lucide="check-circle"></i>
        </button>
      </div>

    </div>
  </div>
</div>

<script src="../assets/js/env.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  lucide.createIcons();

  var params = new URLSearchParams(window.location.search);
  var _email = params.get('email') || '';
  var _token = params.get('token') || '';

  if (!_email || !_token) {
    document.getElementById('password-msg').textContent = 'Invalid or expired link.';
    document.getElementById('password-msg').className = 'msg error';
    document.getElementById('submit-btn').disabled = true;
  }

  function showMsg(text, type) {
    var el = document.getElementById('password-msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  function togglePass(inputId, btn) {
    var input = document.getElementById(inputId);
    if (!input) return;
    var isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    var icon = btn.querySelector('i');
    if (icon) {
      icon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
      lucide.createIcons();
    }
  }

  async function handleSetPassword() {
    var pass    = document.getElementById('new-password').value;
    var confirm = document.getElementById('confirm-password').value;

    var passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^$*])[A-Za-z\d@$!%*?&#^$*]{8,}$/;
    if (!passRegex.test(pass)) {
      showMsg('Password must be min 8 chars, 1 upper, 1 lower, 1 number, and 1 special char.', 'error');
      return;
    }
    if (pass !== confirm) {
      showMsg('Passwords do not match.', 'error');
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    showMsg('Setting password...', 'success');

    var result = await apiRequest('/password/reset', {
      method: 'POST',
      body: JSON.stringify({
        email: _email,
        otp_code: _token,
        new_password: pass,
        new_password_confirmation: confirm
      })
    });

    if (result.success) {
      var payload = result.data && result.data.data ? result.data.data : (result.data || {});
      var token = payload.token;
      var user  = payload.user;

      if (token && user) {
        localStorage.setItem('hris_token', token);
        localStorage.setItem('hris_user', JSON.stringify(user));

        var profileResult = await apiRequest('/profile');
        var profileData = profileResult.success && profileResult.data && profileResult.data.data
          ? profileResult.data.data
          : null;
        var hasFace = profileData && profileData.has_face_registered === true;

        if (!hasFace) {
          showMsg('Password set! Redirecting to face registration...', 'success');
          setTimeout(function() {
            window.location.href = '/pages/face-sample/face-sample.html?onboarding=true';
          }, 1500);
          return;
        }
      }

      showMsg('Password set! Redirecting to login...', 'success');
      setTimeout(function() {
        window.location.href = '/pages/login.html';
      }, 2000);
    } else {
      showMsg(result.error || 'Failed to set password. Link may have expired.', 'error');
      btn.disabled = false;
    }
  }

  document.getElementById('confirm-password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSetPassword();
  });
</script>
</body>
</html>
