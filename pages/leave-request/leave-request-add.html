<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Add Leave Request</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
  <link rel="stylesheet" href="../../assets/css/leave.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row" style="margin-bottom:1.4rem;">
      <div>
        <h1 class="hub-title">Add Leave Request</h1>
        <div class="hub-sub">SUBMIT LEAVE OR ABSENCE REQUEST</div>
      </div>
    </div>

    <div class="leave-form-card">
      <div class="leave-form-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;color:#2e7d4f;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Leave Request Form
      </div>

      <div class="leave-form-grid">

        <!-- Employee Name (readonly) -->
        <div class="leave-form-field">
          <label class="leave-form-label">Employee Name</label>
          <input type="text" class="leave-form-input" id="f-employee-name" disabled>
        </div>

        <!-- Manager (readonly) -->
        <div class="leave-form-field">
          <label class="leave-form-label">Reports To (Manager)</label>
          <input type="text" class="leave-form-input" id="f-manager-name" disabled>
        </div>

        <!-- Leave Type -->
        <div class="leave-form-field" id="field-type">
          <label class="leave-form-label">Leave Type <span class="req">*</span></label>
          <select class="leave-form-select" id="f-type" onchange="onTypeChange()">
            <option value="">— Select type —</option>
            <option value="annual">Annual Leave</option>
            <option value="sick">Sick</option>
            <option value="permit">Permit</option>
            <option value="leave_of_absence">Leave of Absence</option>
          </select>
          <span class="leave-form-err" id="err-type">Please select a leave type.</span>
        </div>

        <!-- Date From -->
        <div class="leave-form-field" id="field-date-from">
          <label class="leave-form-label">Date From <span class="req">*</span></label>
          <div class="leave-flatpickr-wrap">
            <input type="text" class="leave-form-input" id="f-date-from" placeholder="Start date..." readonly style="cursor:pointer;">
            <svg class="leave-cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <span class="leave-form-err" id="err-date-from">Please select a start date.</span>
        </div>

        <!-- Date To -->
        <div class="leave-form-field" id="field-date-to">
          <label class="leave-form-label">Date To <span class="req">*</span></label>
          <div class="leave-flatpickr-wrap">
            <input type="text" class="leave-form-input" id="f-date-to" placeholder="End date..." readonly style="cursor:pointer;">
            <svg class="leave-cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <span class="leave-form-err" id="err-date-to">Please select an end date.</span>
        </div>

        <!-- Reason -->
        <div class="leave-form-field full" id="field-reason">
          <label class="leave-form-label">Reason <span class="req">*</span></label>
          <textarea class="leave-form-textarea" id="f-reason" placeholder="Provide a brief reason for your leave request..."></textarea>
          <span class="leave-form-err" id="err-reason">Please enter a reason.</span>
        </div>

        <!-- Doctor Letter (sick only) -->
        <div class="leave-form-field full" id="field-doctor-letter" style="display:none;">
          <label class="leave-form-label">Doctor Letter <span style="font-size:11px;color:#9aabb7;">(Image or PDF, max 20MB)</span></label>
          <div class="leave-upload-area" id="upload-area">
            <input type="file" id="f-doctor-letter" accept=".jpg,.jpeg,.png,.pdf" onchange="onFileChange(this)">
            <div class="leave-upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="leave-upload-text"><strong>Click to upload</strong> or drag and drop</div>
            <div class="leave-upload-text">JPG, PNG, PDF up to 20MB</div>
            <div class="leave-upload-filename" id="upload-filename"></div>
          </div>
          <span class="leave-form-err" id="err-file">File too large (max 20MB).</span>
        </div>

      </div>

      <div class="leave-form-actions">
        <button class="leave-btn-back-form" onclick="window.location.href='leave-request.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <button class="leave-btn-submit" id="btn-submit" onclick="submitLeave()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>
          Submit Request
        </button>
      </div>
    </div>

  </main>
</div>

<!-- TOAST -->
<div class="toast" id="app-toast">
  <svg class="toast-icon" id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span class="toast-text" id="toast-text"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/leave.js"></script>
<script src="../../assets/js/render/leave.js"></script>
<script>
guardRoute(['staff', 'team_leader', 'hrd_manager', 'technical_manager']);

var _user     = JSON.parse(localStorage.getItem('hris_user') || '{}');
var _dateFrom = '';
var _dateTo   = '';

/* ── Init ── */
window.addEventListener('load', function() {
  window.loadComponents();

  /* Fill readonly fields from localStorage */
  document.getElementById('f-employee-name').value = _user.name         || '—';
  document.getElementById('f-manager-name').value  = _user.manager_name || _user.manager || '—';

  /* Flatpickr — date from */
  flatpickr('#f-date-from', {
    dateFormat: 'Y-m-d',
    onChange: function(sel, str) {
      _dateFrom = str;
      /* auto-set date-to min to prevent invalid range */
      if (_fpTo) _fpTo.set('minDate', str);
      /* if date-to < date-from, reset date-to */
      if (_dateTo && _dateTo < str) {
        _dateTo = '';
        _fpTo.clear();
      }
      clearErr('field-date-from');
    }
  });

  /* Flatpickr — date to */
  _fpTo = flatpickr('#f-date-to', {
    dateFormat: 'Y-m-d',
    onChange: function(sel, str) {
      _dateTo = str;
      clearErr('field-date-to');
    }
  });
});

var _fpTo = null;

/* ── Show/hide doctor letter field ── */
function onTypeChange() {
  var type = document.getElementById('f-type').value;
  var fieldDoc = document.getElementById('field-doctor-letter');
  fieldDoc.style.display = type === 'sick' ? '' : 'none';
  if (type !== 'sick') {
    document.getElementById('f-doctor-letter').value = '';
    document.getElementById('upload-filename').style.display = 'none';
    document.getElementById('upload-filename').textContent = '';
  }
  clearErr('field-type');
}

/* ── File upload change ── */
function onFileChange(input) {
  var fileEl     = document.getElementById('upload-filename');
  var errEl      = document.getElementById('field-doctor-letter');
  if (!input.files.length) return;
  var file = input.files[0];
  var maxBytes = 20 * 1024 * 1024;
  if (file.size > maxBytes) {
    errEl.classList.add('has-err');
    document.getElementById('err-file').style.display = 'block';
    input.value = '';
    fileEl.style.display = 'none';
    return;
  }
  errEl.classList.remove('has-err');
  document.getElementById('err-file').style.display = 'none';
  fileEl.textContent  = file.name;
  fileEl.style.display = 'block';
}

/* ── Validation ── */
function validate() {
  var ok     = true;
  var type   = document.getElementById('f-type').value;
  var reason = document.getElementById('f-reason').value.trim();

  if (!type)    { setErr('field-type');      ok = false; } else clearErr('field-type');
  if (!_dateFrom) { setErr('field-date-from'); ok = false; } else clearErr('field-date-from');
  if (!_dateTo)   { setErr('field-date-to');   ok = false; } else clearErr('field-date-to');
  if (!reason)  { setErr('field-reason');    ok = false; } else clearErr('field-reason');

  if (type === 'sick') {
    var fileInput = document.getElementById('f-doctor-letter');
    if (fileInput.files.length) {
      var file = fileInput.files[0];
      if (file.size > 20 * 1024 * 1024) {
        document.getElementById('field-doctor-letter').classList.add('has-err');
        document.getElementById('err-file').style.display = 'block';
        ok = false;
      }
    }
  }
  return ok;
}

function setErr(fieldId)   { var el = document.getElementById(fieldId); if (el) el.classList.add('has-err'); }
function clearErr(fieldId) { var el = document.getElementById(fieldId); if (el) el.classList.remove('has-err'); }

/* ── Submit ── */
async function submitLeave() {
  if (!validate()) return;

  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Submitting...';

  var formData = new FormData();
  formData.append('leave_date_from', _dateFrom);
  formData.append('leave_date_to',   _dateTo);
  formData.append('leave_type',      document.getElementById('f-type').value);
  formData.append('reason',          document.getElementById('f-reason').value.trim());

  var fileInput = document.getElementById('f-doctor-letter');
  if (fileInput.files.length) {
    formData.append('doctor_letter', fileInput.files[0]);
  } else {
    formData.append('doctor_letter', '');
  }

  var res = await createLeaveRequest(formData);

  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg> Submit Request';

  if (res.success) {
    sessionStorage.setItem('leave_toast_msg',  res.message || 'Leave request submitted successfully.');
    sessionStorage.setItem('leave_toast_type', 'success');
    window.location.href = 'leave-request.html';
  } else {
    showToast(res.error || 'Failed to submit request.', 'error');
  }
}

var _toastTimer = null;
function showToast(message, type) {
  var toast  = document.getElementById('app-toast');
  var iconEl = document.getElementById('toast-icon');
  var textEl = document.getElementById('toast-text');
  if (!toast) return;
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.className = 'toast ' + (type || 'success');
  textEl.textContent = message;
  iconEl.innerHTML = type === 'error'
    ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    : '<polyline points="20 6 9 17 4 12"/>';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { toast.classList.add('show'); });
  });
  _toastTimer = setTimeout(function() { toast.classList.remove('show'); _toastTimer = null; }, 3500);
}
</script>
</body>
</html>
