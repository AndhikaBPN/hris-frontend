<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Team Detail</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>

  <main class="content">

    <!-- HERO -->
    <div class="team-hero">
      <div class="team-hero-left">
        <div class="team-hero-label" id="hero-label">ENGINEERING UNIT</div>
        <h1 class="team-hero-name" id="hero-name">Engineering Alpha</h1>
        <div class="team-hero-lead">
          <div class="staff-avatar" id="hero-avatar" style="width:30px;height:30px;font-size:11px;background:linear-gradient(135deg,#3d5c45,#6dbf80);">AR</div>
          <div>
            <div class="hero-lead-name" id="hero-lead-name">Alex Rivera</div>
            <div class="hero-lead-role" id="hero-lead-role">Lead Technical Architect</div>
          </div>
        </div>
      </div>
      <button class="btn-edit-team" id="btn-edit" onclick="openEditModal()" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit Team
      </button>
    </div>

    <!-- STATS -->
    <div class="detail-stats-row">
      <div class="card detail-stat-card">
        <div class="ds-label">TOTAL MEMBERS</div>
        <div class="ds-value" id="stat-members">0</div>
        <div class="ds-trend"><svg viewBox="0 0 16 10" fill="none" width="14" height="10"><polyline points="1 9 5 4 9 7 15 1" stroke="#3d5c45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color:#3d5c45;font-size:12px;" id="stat-growth">+3 this month</span></div>
      </div>
      <div class="card detail-stat-card">
        <div class="ds-label">RETENTION RATE</div>
        <div class="ds-value" id="stat-retention">—</div>
        <div class="ds-bar"><div class="ds-bar-fill" id="stat-retention-bar" style="width:0%;"></div></div>
      </div>
      <div class="card detail-stat-card">
        <div class="ds-label">PERFORMANCE SCORE</div>
        <div class="ds-value" id="stat-perf">—</div>
        <div class="ds-sub">out of 5.0</div>
      </div>
    </div>

    <!-- MAIN GRID -->
    <div class="detail-main-grid">

      <!-- TEAM ROSTER -->
      <div class="card roster-card">
        <div class="attendance-header" id="roster-header">
          <h2 class="section-title">Team Roster</h2>
          <a class="view-all" href="#" onclick="expandRoster();return false;">VIEW ALL</a>
        </div>
        <table class="att-table">
          <thead id="roster-thead">
            <tr><th>MEMBER</th><th>ROLE</th><th>JOIN DATE</th><th>STATUS</th></tr>
          </thead>
          <tbody id="roster-tbody"></tbody>
        </table>
      </div>

      <!-- RIGHT COL -->
      <div class="detail-right-col">
        <!-- Active Projects -->
        <div class="card projects-card">
          <div class="attendance-header"><h2 class="section-title">Active Projects</h2></div>
          <div id="projects-list"></div>
        </div>
        <!-- Team Activity -->
        <div class="card activity-card">
          <div class="attendance-header"><h2 class="section-title">Team Activity</h2></div>
          <div class="activity-list" id="activity-list"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal" onclick="closeEditModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div><div class="modal-title">Edit Team</div><div class="modal-subtitle">Perbarui informasi tim</div></div>
      <button class="modal-close" onclick="closeEditModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="create-form">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Team Name</label><input type="text" class="form-input" id="ef-name"></div>
        <div class="form-group"><label class="form-label">Division</label><select class="form-input" id="ef-division"><option>Engineering</option><option>Design</option><option>Product</option><option>HR</option><option>Finance</option><option>Operations</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Team Lead</label><select class="form-input" id="ef-lead"><option>Alex Rivera</option><option>Maya Putri</option><option>Andi Hartono</option><option>Diana Nas</option></select></div>
        <div class="form-group"><label class="form-label">Primary Function</label><input type="text" class="form-input" id="ef-function"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input form-textarea" id="ef-desc"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
      <button class="btn-submit" onclick="submitEdit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>Simpan</button>
    </div>
  </div>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/team.js"></script>
<script src="../../assets/js/team-detail.js"></script>
<script>
guardRoute(["hrd_manager", "technical_manager", "c_level", "team_leader"]);

window.addEventListener("load", function() {
  window.loadComponents();
});
</script>
</body>
</html>
