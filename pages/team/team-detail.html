<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Team Detail</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>

  <main class="content">

    <!-- HERO -->
    <div class="team-hero">
      <div class="team-hero-left">
        <div class="team-hero-label" id="hero-label">ENGINEERING UNIT</div>
        <h1 class="team-hero-name" id="hero-name">Engineering Alpha</h1>
        <div class="team-hero-lead">
          <div class="staff-avatar" id="hero-avatar" style="width:30px;height:30px;font-size:11px;background:linear-gradient(135deg,#3d5c45,#6dbf80);">AR</div>
          <div>
            <div class="hero-lead-name" id="hero-lead-name">Alex Rivera</div>
            <div class="hero-lead-role" id="hero-lead-role">Lead Technical Architect</div>
          </div>
        </div>
      </div>
      <button class="btn-edit-team" id="btn-edit" onclick="openEditModal()" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit Team
      </button>
    </div>

    <!-- STATS -->
    <div class="detail-stats-row">
      <div class="card detail-stat-card">
        <div class="ds-label">TOTAL MEMBERS</div>
        <div class="ds-value" id="stat-members">0</div>
        <div class="ds-trend"><svg viewBox="0 0 16 10" fill="none" width="14" height="10"><polyline points="1 9 5 4 9 7 15 1" stroke="#3d5c45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color:#3d5c45;font-size:12px;" id="stat-growth">+3 this month</span></div>
      </div>
      <div class="card detail-stat-card">
        <div class="ds-label">RETENTION RATE</div>
        <div class="ds-value" id="stat-retention">—</div>
        <div class="ds-bar"><div class="ds-bar-fill" id="stat-retention-bar" style="width:0%;"></div></div>
      </div>
      <div class="card detail-stat-card">
        <div class="ds-label">PERFORMANCE SCORE</div>
        <div class="ds-value" id="stat-perf">—</div>
        <div class="ds-sub">out of 5.0</div>
      </div>
    </div>

    <!-- MAIN GRID -->
    <div class="detail-main-grid">

      <!-- TEAM ROSTER -->
      <div class="card roster-card">
        <div class="attendance-header" id="roster-header">
          <h2 class="section-title">Team Roster</h2>
          <a class="view-all" href="#" onclick="expandRoster();return false;">VIEW ALL</a>
        </div>
        <table class="att-table">
          <thead id="roster-thead">
            <tr><th>MEMBER</th><th>ROLE</th><th>JOIN DATE</th><th>STATUS</th></tr>
          </thead>
          <tbody id="roster-tbody"></tbody>
        </table>
      </div>

      <!-- RIGHT COL -->
      <div class="detail-right-col">
        <!-- Active Projects -->
        <div class="card projects-card">
          <div class="attendance-header"><h2 class="section-title">Active Projects</h2></div>
          <div id="projects-list"></div>
        </div>
        <!-- Team Activity -->
        <div class="card activity-card">
          <div class="attendance-header"><h2 class="section-title">Team Activity</h2></div>
          <div class="activity-list" id="activity-list"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal" onclick="closeEditModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div><div class="modal-title">Edit Team</div><div class="modal-subtitle">Perbarui informasi tim</div></div>
      <button class="modal-close" onclick="closeEditModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="create-form">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Team Name</label><input type="text" class="form-input" id="ef-name"></div>
        <div class="form-group"><label class="form-label">Division</label><select class="form-input" id="ef-division"><option>Engineering</option><option>Design</option><option>Product</option><option>HR</option><option>Finance</option><option>Operations</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Team Lead</label><select class="form-input" id="ef-lead"><option>Alex Rivera</option><option>Maya Putri</option><option>Andi Hartono</option><option>Diana Nas</option></select></div>
        <div class="form-group"><label class="form-label">Primary Function</label><input type="text" class="form-input" id="ef-function"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input form-textarea" id="ef-desc"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">Batal</button>
      <button class="btn-submit" onclick="submitEdit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>Simpan</button>
    </div>
  </div>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/team.js"></script>
<script src="../../assets/js/fetch/team-detail.js"></script>
<script src="../../assets/js/render/team.js"></script>
<script src="../../assets/js/render/team-detail.js"></script>
<script>
guardRoute(["hrd_manager", "technical_manager", "c_level", "team_leader", "staff"]);

var currentTeamId = null;
var currentTeamData = null;
var rosterData = [];
var projectsData = [];
var activitiesData = [];
var rosterExpanded = false;

window.addEventListener("load", function() {
  window.loadComponents();

  currentTeamId = sessionStorage.getItem('selectedTeamId');
  sessionStorage.removeItem('selectedTeamId');

  if (!currentTeamId) {
    window.location.replace('team-hub.html');
    return;
  }

  loadTeamDetail();
});

async function loadTeamDetail() {
  var res = await fetchTeamDetail(currentTeamId);
  if (res.success) {
    currentTeamData = res.data;
    renderHero();
    loadTeamRoster();
    loadTeamProjects();
    loadTeamActivities();
  } else {
    console.error('Failed to load team detail:', res.error);
  }
}

async function loadTeamRoster() {
  var res = await fetchTeamRoster(currentTeamId);
  if (res.success) {
    rosterData = res.data;
    renderRoster();
  }
}

async function loadTeamProjects() {
  var res = await fetchTeamProjects(currentTeamId);
  if (res.success) {
    projectsData = res.data;
    renderProjects();
  }
}

async function loadTeamActivities() {
  var res = await fetchTeamActivities(currentTeamId);
  if (res.success) {
    activitiesData = res.data;
    renderActivities();
  }
}

function renderHero() {
  if (!currentTeamData) return;

  var heroData = buildTeamHeroData(currentTeamData);
  var statsData = buildTeamStatsData(currentTeamData, rosterData.length);

  document.getElementById('hero-label').textContent = heroData.label;
  document.getElementById('hero-name').textContent = heroData.name;
  document.getElementById('hero-avatar').textContent = heroData.leadInitials;
  document.getElementById('hero-avatar').style.background = 'linear-gradient(135deg,' + heroData.leadColor + ',#6dbf80)';
  document.getElementById('hero-lead-name').textContent = heroData.leadName;
  document.getElementById('hero-lead-role').textContent = heroData.leadRole;

  document.getElementById('stat-members').textContent = statsData.totalMembers;
  document.getElementById('stat-growth').textContent = statsData.growth;
  document.getElementById('stat-retention').textContent = Math.round(statsData.retentionRate) + '%';
  document.getElementById('stat-retention-bar').style.width = statsData.retentionRate + '%';
  document.getElementById('stat-perf').textContent = (statsData.performanceScore || 0).toFixed(1);
}

function renderRoster() {
  var rows = rosterExpanded ? buildRosterExpanded(rosterData) : buildRosterPreview(rosterData);
  var tbody = document.getElementById('roster-tbody');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">No members found</td></tr>';
    return;
  }

  rows.forEach(function(row) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><div style="display:flex;align-items:center;gap:8px;">' +
                   '<div style="width:28px;height:28px;border-radius:50%;background:' + row.color + ';color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">' +
                   row.initials + '</div>' +
                   '<span>' + row.name + '</span></div></td>' +
                   '<td>' + row.role + '</td>' +
                   '<td>' + row.joinDate + '</td>' +
                   '<td><span style="padding:4px 8px;background:#e8f5ec;color:#2e7d4f;border-radius:4px;font-size:12px;font-weight:500;">' + row.status + '</span></td>';
    tbody.appendChild(tr);
  });
}

function renderProjects() {
  var rows = buildProjectsList(projectsData);
  var projectsList = document.getElementById('projects-list');
  projectsList.innerHTML = '';

  if (rows.length === 0) {
    projectsList.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">No active projects</div>';
    return;
  }

  rows.forEach(function(row) {
    var div = document.createElement('div');
    div.style.marginBottom = '16px';
    div.innerHTML = '<div style="margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;">' +
                    '<div style="font-weight:500;font-size:13px;">' + row.name + '</div>' +
                    '<div style="font-size:12px;color:#666;">' + row.percentage + '%</div></div>' +
                    '<div style="height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;">' +
                    '<div style="height:100%;background:#2e7d4f;width:' + row.percentage + '%;"></div></div>' +
                    '<div style="font-size:12px;color:#999;margin-top:6px;">' + row.description + '</div>';
    projectsList.appendChild(div);
  });
}

function renderActivities() {
  var rows = buildActivityList(activitiesData);
  var activityList = document.getElementById('activity-list');
  activityList.innerHTML = '';

  if (rows.length === 0) {
    activityList.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">No recent activity</div>';
    return;
  }

  rows.forEach(function(row) {
    var div = document.createElement('div');
    div.style.paddingBottom = '12px';
    div.style.marginBottom = '12px';
    div.style.borderBottom = '1px solid #e0e0e0';
    div.innerHTML = '<div style="display:flex;gap:8px;">' +
                    '<div style="width:20px;height:20px;flex-shrink:0;color:#666;">' + row.icon + '</div>' +
                    '<div style="flex:1;">' +
                    '<div style="font-size:13px;line-height:1.5;">' + row.text + '</div>' +
                    '<div style="font-size:11px;color:#999;margin-top:4px;">' + row.meta + '</div></div></div>';
    activityList.appendChild(div);
  });
}

function expandRoster() {
  rosterExpanded = !rosterExpanded;
  renderRoster();
  return false;
}

function openEditModal() {
  if (!currentTeamData) return;

  document.getElementById('ef-name').value = currentTeamData.team_name || '';
  document.getElementById('ef-lead').value = currentTeamData.lead_name || '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
}

async function submitEdit() {
  var updateData = {
    team_name: document.getElementById('ef-name').value,
    team_lead_id: currentTeamData.team_lead_id
  };

  if (!updateData.team_name) {
    alert('Team name is required');
    return;
  }

  var res = await updateTeam(currentTeamId, updateData);
  if (res.success) {
    alert('Team updated successfully');
    closeEditModal();
    loadTeamDetail();
  } else {
    alert('Error: ' + (res.error || 'Update failed'));
  }
}
</script>
</body>
</html>
