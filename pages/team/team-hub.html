<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary – Team Hub</title>
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/team-hub.css">
</head>
<body>
<div id="sidebar-placeholder"></div>

<div class="main-wrap">
<div id="navbar-placeholder"></div>
  <main class="content">

    <div class="page-header-row">
      <div>
        <h1 class="hub-title">Teams</h1>
        <div class="hub-sub">ORGANIZATIONAL CORE UNITS</div>
      </div>
      <button class="btn-create-team" id="btn-create" onclick="openCreateModal()" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Create Team
      </button>
    </div>

    <div class="card team-list-card">
      <div class="team-search-row">
        <div class="team-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search teams..." oninput="filterTeams()" class="team-search-input">
        </div>
      </div>
      <div class="team-table-head">
        <div>TEAM NAME</div><div>TEAM LEAD</div><div>TOTAL MEMBERS</div><div>ACTIONS</div>
      </div>
      <div id="team-list"></div>
      <div class="team-pagination">
        <div class="pagination-left">
          <span class="pag-label">LIMIT PER PAGE</span>
          <select class="pag-select" id="limit-select" onchange="onLimitChange()"><option value="10" selected>10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
        </div>
        <div class="pagination-right">
          <span class="pag-info" id="pag-info">Showing 1-6 of 6 teams</span>
          <button class="pag-btn" id="pag-prev" onclick="changePage(-1)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="pag-btn" id="pag-next" onclick="changePage(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- CREATE TEAM MODAL -->
<div class="modal-overlay" id="create-modal" onclick="closeCreateModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div><div class="modal-title">Create New Team</div><div class="modal-subtitle">Add a new team to the organization</div></div>
      <button class="modal-close" onclick="closeCreateModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="create-form">
      <div class="form-group"><label class="form-label">Team Name <span class="req">*</span></label><input type="text" class="form-input" id="f-name" placeholder="e.g. Engineering Alpha"></div>
      <div class="form-group"><label class="form-label">Team Lead <span class="req">*</span></label><select class="form-input" id="f-lead"><option value="">Select Team Lead</option></select></div>
      <div id="form-error" class="form-error" style="display:none;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
      <button class="btn-submit" onclick="submitCreateTeam()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>Create Team</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal-overlay" id="success-modal" onclick="closeSuccessModal()">
  <div class="modal-box" onclick="event.stopPropagation()" style="max-width:380px;padding:32px 24px;">
    <div style="text-align:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;margin:0 auto 12px;"><polyline points="20 6 9 17 4 12"/></svg>
      <div id="success-message" style="font-size:15px;font-weight:600;color:#333;margin-bottom:6px;"></div>
      <div style="font-size:13px;color:#777;">Team has been successfully added to the system</div>
    </div>
  </div>
</div>

<script src="../../assets/js/env.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/dashboard-shared.js"></script>
<script src="../../assets/js/sidebar.js"></script>
<script src="../../assets/js/fetch/team.js"></script>
<script src="../../assets/js/render/team.js"></script>
<script>
guardRoute(["hrd_manager", "technical_manager", "c_level", "team_leader", "staff"]);

/* ── ROLE CONFIG ── */
var user = JSON.parse(localStorage.getItem('hris_user') || '{}');
var CURRENT_ROLE = user.role || 'staff';
var CAN_MANAGE = (CURRENT_ROLE === 'hrd_manager' || CURRENT_ROLE === 'technical_manager' || CURRENT_ROLE === 'c_level');

/* ── TEAM DATA ── */
var TEAMS_PAGE = [];
var currentPage = 1;
var currentLimit = 10;
var lastPage = 1;
var currentSearch = '';

/* ── PAGE RENDERING ── */
function renderTeamRow(teamRow) {
  var actionHtml = '';
  if (teamRow.actions) {
    actionHtml = '<div class="team-actions"><div style="display:flex;gap:6px;">' +
      '<button class="btn-mem-edit" onclick="event.preventDefault();event.stopPropagation();alert(\'Edit: ' + teamRow.name + '\')">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
        ' Edit</button>' +
      '<button class="btn-mem-delete" onclick="event.preventDefault();event.stopPropagation();deleteTeam(' + teamRow.actions.delete.id + ',\'' + teamRow.actions.delete.name + '\')">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
        ' Hapus</button>' +
      '</div></div>';
  }

  return '<a class="team-row' + (teamRow.classNames ? ' ' + teamRow.classNames : '') + '" href="' + teamRow.href + '">' +
    '<div class="team-name-cell"><div class="team-icon" style="background:' + teamRow.iconBg + ';color:' + teamRow.iconColor + ';">' + teamRow.icon + '</div><div><div class="team-name-text">' + teamRow.name + '</div><div class="team-name-sub">' + teamRow.division + '</div></div></div>' +
    '<div class="team-lead-cell"><div class="staff-avatar" style="width:28px;height:28px;font-size:10px;background:' + teamRow.leadColor + ';">' + teamRow.leadInitials + '</div><span class="team-lead-name">' + teamRow.leadName + '</span></div>' +
    '<div><span class="members-badge">' + teamRow.members + ' Players</span></div>' +
    actionHtml +
    '</a>';
}

function renderList() {
  var html = TEAMS_PAGE.map(renderTeamRow).join('');

  var el = document.getElementById('team-list');
  if (el) el.innerHTML = html || '<div class="team-empty">No teams found</div>';

  var info = document.getElementById('pag-info');
  if (info) info.textContent = 'Page ' + currentPage + ' of ' + lastPage;
  var prev = document.getElementById('pag-prev');
  var next = document.getElementById('pag-next');
  if (prev) prev.disabled = currentPage <= 1;
  if (next) next.disabled = currentPage >= lastPage;
}

async function filterTeams() {
  var q = (document.getElementById('search-input') || {}).value || '';
  var limit = parseInt((document.getElementById('limit-select') || {}).value || 10);
  currentSearch = q;
  currentLimit = limit;
  currentPage = 1;

  var res = await fetchTeams({
    page: currentPage,
    limit: currentLimit,
    search: currentSearch,
    order_by: 'id',
    sorting: 'asc'
  });

  if (res.success) {
    TEAMS_PAGE = buildTeamRows(mapTeamData(res.data), CAN_MANAGE);
    lastPage = res.meta.last_page || 1;
    renderList();
  }
}

async function onLimitChange() {
  var limit = parseInt((document.getElementById('limit-select') || {}).value || 10);
  currentLimit = limit;
  currentPage = 1;

  var res = await fetchTeams({
    page: currentPage,
    limit: currentLimit,
    search: currentSearch,
    order_by: 'id',
    sorting: 'asc'
  });

  if (res.success) {
    TEAMS_PAGE = buildTeamRows(mapTeamData(res.data), CAN_MANAGE);
    lastPage = res.meta.last_page || 1;
    renderList();
  }
}

async function changePage(dir) {
  var newPage = currentPage + dir;
  if (newPage < 1 || newPage > lastPage) return;

  currentPage = newPage;

  var res = await fetchTeams({
    page: currentPage,
    limit: currentLimit,
    search: currentSearch,
    order_by: 'id',
    sorting: 'asc'
  });

  if (res.success) {
    TEAMS_PAGE = buildTeamRows(mapTeamData(res.data), CAN_MANAGE);
    lastPage = res.meta.last_page || 1;
    renderList();
  }
}

/* ── MODAL FUNCTIONS ── */
async function openCreateModal() {
  await populateTeamLeadDropdown();
  document.getElementById('create-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeCreateModal() {
  document.getElementById('create-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function openSuccessModal(message) {
  var msgEl = document.getElementById('success-message');
  if (msgEl) msgEl.textContent = message;
  document.getElementById('success-modal').classList.add('open');
  document.body.style.overflow = 'hidden';

  setTimeout(function() {
    closeSuccessModal();
  }, 2000);
}

function closeSuccessModal() {
  document.getElementById('success-modal').classList.remove('open');
  document.body.style.overflow = '';
  location.reload();
}

async function submitCreateTeam() {
  var name = (document.getElementById('f-name')||{}).value || '';
  var lead = (document.getElementById('f-lead')||{}).value || '';
  var err = document.getElementById('form-error');

  if (!name.trim() || !lead) {
    if (err) { err.textContent='Please fill in all required fields (*)'; err.style.display='block'; }
    return;
  }

  if (err) err.style.display='none';

  var result = await createTeam({
    team_name: name,
    team_lead_id: parseInt(lead)
  });

  if (result.success) {
    closeCreateModal();
    document.getElementById('f-name').value = '';
    document.getElementById('f-lead').value = '';
    openSuccessModal(result.message);
  } else {
    if (err) { err.textContent=result.message; err.style.display='block'; }
  }
}

async function populateTeamLeadDropdown() {
  var res = await getAllTeamLeaders({ limit: 50 });
  if (res.success && res.data && res.data.length > 0) {
    var select = document.getElementById('f-lead');
    if (select) {
      var firstOption = select.querySelector('option');
      select.innerHTML = '';
      if (firstOption) select.appendChild(firstOption);

      res.data.forEach(function(lead) {
        var opt = document.createElement('option');
        opt.value = lead.id;
        opt.textContent = lead.name;
        select.appendChild(opt);
      });
    }
  }
}

function deleteTeam(id, name) {
  if (confirm('Hapus tim "' + name + '"?')) {
    TEAMS_PAGE = TEAMS_PAGE.filter(function(t) { return t.id !== id; });
    filterTeams();
  }
}

function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  el.classList.add('active');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeCreateModal();
    if (typeof closeEditModal === 'function') closeEditModal();
  }
});

/* ── PAGE INITIALIZATION ── */
window.addEventListener('load', async function() {
  var btn = document.getElementById('btn-create');
  if (btn && CAN_MANAGE) btn.style.display = 'inline-flex';

  var tableHead = document.querySelector('.team-table-head');
  if (tableHead && !CAN_MANAGE) {
    var actions = tableHead.querySelector('div:last-child');
    if (actions && actions.textContent === 'ACTIONS') actions.remove();
    tableHead.style.gridTemplateColumns = '2fr 1.5fr 0.8fr';
  }

  if (document.getElementById('team-list')) {
    currentLimit = parseInt((document.getElementById('limit-select') || {}).value || 10);
    var res = await fetchTeams({
      page: currentPage,
      limit: currentLimit,
      search: currentSearch,
      order_by: 'id',
      sorting: 'asc'
    });

    if (res.success && res.data && res.data.length > 0) {
      TEAMS_PAGE = buildTeamRows(mapTeamData(res.data), CAN_MANAGE);
      lastPage = res.meta.last_page || 1;
      renderList();
    } else {
      console.error('Failed to load teams:', res.error);
      document.getElementById('team-list').innerHTML = '<div class="team-empty">No teams found</div>';
    }
  }
});

window.addEventListener("load", function() {
  window.loadComponents();
});
</script>
</body>
</html>
